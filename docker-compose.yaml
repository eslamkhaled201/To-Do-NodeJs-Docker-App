networks:
  Public:
    driver: bridge
  
  internal:
    driver: bridge
    internal: true
    
volumes:
  mysql_data:

services:

  # ─── TRAEFIK ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v2.11          # Traefik uses the official image, no Dockerfile needed
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.traefik.address=:9090"
    ports:
      - "80:80"
      - "9090:9090"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - Public
      - internal

  # ─── REACT FRONTEND ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend        # Docker looks for ./frontend/Dockerfile
      dockerfile: Dockerfile     # explicit but optional — "Dockerfile" is the default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # port 80 because the multi-stage Dockerfile ends with Nginx on :80
    networks:
      - Public
      - internal
    depends_on:
      - traefik
      - api
    cap_drop:
      - ALL # Removes all Linux capabilities from root user inside the container.
    security_opt:
      - no-new-privileges:true # Helps block privilege escalation attacks.

  # ─── NODE API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api             # Docker looks for ./api/Dockerfile
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      # port 3000 matches the PORT variable in server.js
    environment:
       DB_HOST: db
       DB_PORT: 3306
       DB_USER: todouser
       DB_PASSWORD: mypassword
       DB_NAME: tododb
    networks:
      - internal
    depends_on:
      - traefik
      - db
    cap_drop:
      - ALL # Removes all Linux capabilities from root user inside the container.
    security_opt:
      - no-new-privileges:true # Prevents processes from gaining additional privileges after startup. Helps block privilege escalation attacks.

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: todouser
      MYSQL_PASSWORD: mypassword
      MYSQL_DATABASE: tododb
    volumes:
      - mysql_data:/var/lib/mysql          # persist data between restarts
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # auto-run on first start
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: mysql  
    cap_drop:
      - ALL # Removes all Linux capabilities from the container.
    security_opt:
      - no-new-privileges:true 
      # Prevents processes from gaining additional privileges after startup, 
      # For example, if an attacker exploits MySQL and tries to use a SUID binary to become root, Linux will deny the privilege escalation.